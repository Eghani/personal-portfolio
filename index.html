    <link

    <a class="skip-link" href="#main">Skip to content</a>

    <button

    >

        </span>
        <span class="theme-toggle__thumb"></span>
        <span class="theme-toggle__icon theme-toggle__icon--moon">

            <path
              d="M20.1 15.4A7.6 7.6 0 0 1 8.6 3.9 8.4 8.4 0 1 0 20.1 15.4Z"
            ></path>
